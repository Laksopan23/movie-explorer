name: Movie Explorer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test
        env:
          CI: true

      - name: Check code quality
        run: npx eslint src

      - name: Check dependencies for high severity vulnerabilities
        run: npm audit --audit-level=high

      - name: Create production build
        run: npm run build
